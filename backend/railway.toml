# Railway production startup — migrate + gunicorn ONLY.
# Do NOT add loaddata here or in the Railway dashboard Start Command.
[build]
builder = "nixpacks"

[start]
cmd = "sh scripts/railway_start.sh"

[deploy]
startCommand = "sh scripts/railway_start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
